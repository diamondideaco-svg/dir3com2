name: Codex Governance Gate

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codex-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-control-tower-record:
    name: Validate task, owner, reviewer, branch, SHA, and verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pull request handoff metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            function escapeRegex(value) {
              return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function prField(label) {
              const match = body.match(new RegExp('^[-*]\\s*' + escapeRegex(label) + '\\s*:\\s*(.+?)\\s*$', 'im'));
              return match ? match[1].trim() : '';
            }

            function issueField(issueBody, label) {
              const match = issueBody.match(new RegExp('^##\\s*' + escapeRegex(label) + '\\s*$\\s*([^#\\n][^\\n]*)', 'im'));
              return match ? match[1].trim() : '';
            }

            const task = prField('Task');
            const owner = prField('Implementation owner');
            const reviewer = prField('Independent reviewer');
            const branch = prField('Branch');
            const targetSha = prField('Target SHA');
            const verdict = prField('Verdict').toUpperCase();
            const failures = [];

            const allowedOwners = ['Codex Desktop', 'VS Code Codex'];
            const allowedReviewers = ['Codex Desktop', 'VS Code Codex', 'Codex Security'];
            const allowedVerdicts = ['IN_PROGRESS', 'REVIEW', 'PASS', 'FAIL', 'BLOCKED'];

            const taskMatch = task.match(/^#([0-9]+)$/);
            if (!taskMatch) {
              failures.push('Task must reference exactly one GitHub Codex Task issue as #number.');
            } else {
              try {
                const { data: taskRecord } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(taskMatch[1])
                });

                if (taskRecord.pull_request) failures.push('Task must reference a GitHub issue, not a pull request.');
                if (!taskRecord.title.startsWith('[Codex Task]')) failures.push('Task issue title must start with [Codex Task].');

                const taskBody = taskRecord.body || '';
                if (issueField(taskBody, 'Implementation owner') !== owner) failures.push('Task Implementation owner must match the PR record.');
                if (issueField(taskBody, 'Independent reviewer') !== reviewer) failures.push('Task Independent reviewer must match the PR record.');
                if (issueField(taskBody, 'Branch') !== pr.head.ref) failures.push('Task Branch must match the actual PR head branch.');
                if (issueField(taskBody, 'Target SHA').toLowerCase() !== pr.head.sha.toLowerCase()) failures.push('Task Target SHA must match the actual PR head SHA.');
              } catch (error) {
                failures.push('Task issue could not be verified: ' + error.message);
              }
            }

            if (!allowedOwners.includes(owner)) failures.push('Implementation owner must be Codex Desktop or VS Code Codex.');
            if (!allowedReviewers.includes(reviewer)) failures.push('Independent reviewer must be Codex Desktop, VS Code Codex, or Codex Security.');
            if (owner && reviewer && owner === reviewer) failures.push('Implementation owner and independent reviewer must be different.');
            if (branch !== pr.head.ref) failures.push('Declared Branch must equal actual head branch: ' + pr.head.ref);
            if (!/^[0-9a-f]{40}$/i.test(targetSha)) failures.push('Target SHA must be a full 40-character commit SHA.');
            if (targetSha && targetSha.toLowerCase() !== pr.head.sha.toLowerCase()) failures.push('Target SHA must equal actual PR head SHA: ' + pr.head.sha);
            if (!allowedVerdicts.includes(verdict)) failures.push('Verdict must be IN_PROGRESS, REVIEW, PASS, FAIL, or BLOCKED.');

            const summary = [
              '## Codex Control Tower Record',
              '',
              '- Task: ' + (task || 'MISSING'),
              '- Implementation owner: ' + (owner || 'MISSING'),
              '- Independent reviewer: ' + (reviewer || 'MISSING'),
              '- Branch: ' + (branch || 'MISSING'),
              '- Target SHA: ' + (targetSha || 'MISSING'),
              '- Verdict: ' + (verdict || 'MISSING'),
              '',
              failures.length ? '### FAIL' : '### PASS',
              ...(failures.length ? failures.map(item => '- ' + item) : ['Traceability metadata is complete.']),
              '',
              '> This gate validates metadata only. It does not authorize merge or production release.'
            ].join('\n');

            await core.summary.addRaw(summary).write();

            if (failures.length) core.setFailed(failures.join('\n'));
