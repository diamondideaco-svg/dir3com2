name: PR Master Sandbox Validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dir3com_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dir3com_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dir3com_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dir3com_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Sandbox Unit Tests
        run: npm run test:sandbox

      - name: Schema Compatibility Integration Tests
        run: npm run test:schema-compat

      - name: Pre-deployment Core Schema Verification (read-only)
        run: |
          node scripts/sandbox/apply-core-migration-to-db.mjs
          npm run sandbox:core-schema:verify

      - name: Migration Safety Checks
        run: npm run sandbox:migration-safety

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
