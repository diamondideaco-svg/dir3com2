name: Codex Task
description: Create the single source-of-truth record for a DIR3COM engineering task
title: "[Codex Task] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This issue is the authoritative task record. One task has one implementation owner, one branch/PR, and a different independent reviewer.
  - type: textarea
    id: mission
    attributes:
      label: Mission and bounded scope
      description: State the required outcome and explicit exclusions.
      placeholder: "Outcome: ...\nDo not: ..."
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Implementation owner
      description: Truthful observed surface description; role and verified session establish assignment, not this name.
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Independent reviewer
      description: Truthful observed surface description; role and verified session establish assignment, not this name.
    validations:
      required: true
  - type: input
    id: implementation_session
    attributes:
      label: Implementation session
      description: Required for all reviews; full verified implementation-session UUID.
  - type: input
    id: reviewer_session
    attributes:
      label: Reviewer session
      description: Required for all reviews; distinct verified non-author reviewer-session UUID.
  - type: input
    id: reviewer_receipt
    attributes:
      label: Reviewer receipt
      description: Required for all reviews; exact-artifact functional receipt ID on this Task, hash-bound in signed proof.
  - type: input
    id: branch
    attributes:
      label: Branch
      description: Use TBD only before implementation starts; replace it as soon as the branch exists.
      placeholder: chore/example
    validations:
      required: true
  - type: input
    id: pull_request
    attributes:
      label: Pull request
      description: Use TBD until opened, then record the PR number or URL.
      placeholder: "#123"
    validations:
      required: true
  - type: input
    id: base_sha
    attributes:
      label: Base SHA
      description: Exact 40-character base commit used to start the task.
      placeholder: 40-character base commit SHA
    validations:
      required: true
  - type: input
    id: worktree
    attributes:
      label: Worktree
      description: Exact local worktree path or GitHub connector isolated branch.
      placeholder: /absolute/path or GitHub connector isolated branch
    validations:
      required: true
  - type: input
    id: target_sha
    attributes:
      label: Current target SHA
      description: Use TBD before the first commit; review requires the exact 40-character SHA.
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: input
    id: last_verified_result
    attributes:
      label: Last verified result
      description: Most recent result proven from repository, CI, runtime, or review evidence.
    validations:
      required: true
  - type: input
    id: next_action
    attributes:
      label: Next action
      description: One concrete action and its owner.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: List required tests, QA, security coverage, and PASS criteria.
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Current verdict
      options:
        - PLANNED
        - IN_PROGRESS
        - REVIEW
        - PASS
        - FAIL
        - BLOCKED
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Blockers and unresolved risks
      placeholder: NONE or a concrete blocker with owner
    validations:
      required: true
  - type: input
    id: governance_version
    attributes:
      label: Governance version
      value: '2'
    validations:
      required: true
  - type: input
    id: implementation_role
    attributes:
      label: Implementation role
      value: implementer
  - type: input
    id: reviewer_role
    attributes:
      label: Reviewer role
      value: independent reviewer
  - type: input
    id: governance_proof_receipt
    attributes:
      label: Governance proof receipt
      description: Canonical signed v2 proof JSON comment; approved-base authority required. PENDING is not approval.
  - type: input
    id: evidence_scope
    attributes:
      label: Evidence scope
      description: Exact bounded artifact scope shared by Task, PR and signed proof.
